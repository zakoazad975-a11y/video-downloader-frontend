<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medya İndirici</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 32px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); width: 100%; max-width: 480px; text-align: center; border: 1px solid #334155; }
        h1 { margin-bottom: 24px; color: #38bdf8; font-size: 26px; font-weight: 700; }
        input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 15px; margin-bottom: 16px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #0284c7; color: #ffffff; font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        #status { margin-top: 20px; font-size: 14px; min-height: 24px; word-break: break-all; }
        a.download-btn { display: inline-block; padding: 12px 24px; background: #22c55e; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 600; transition: background 0.2s; margin-top: 10px; }
        a.download-btn:hover { background: #16a34a; }
        .error { color: #f87171; }
        .loading { color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h1>Medya İndirici</h1>
    <input type="text" id="videoUrl" placeholder="Video bağlantısını buraya yapıştırın...">
    <button onclick="downloadMedia()">İndirme Bağlantısı Al</button>
    <div id="status"></div>
</div>

<script>
    async function downloadMedia() {
        const urlInput = document.getElementById('videoUrl');
        const status = document.getElementById('status');
        const url = urlInput.value.trim();
        
        if (!url) {
            status.innerHTML = '<span class="error">Lütfen geçerli bir bağlantı girin.</span>';
            return;
        }

        status.innerHTML = '<span class="loading">İşleniyor, lütfen bekleyin...</span>';

        try {
            // İsteği doğrudan kendi Vercel Backend sunucumuza gönderiyoruz
            const response = await fetch('https://video-downloader-vercel-ten.vercel.app/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            if (data.downloadUrl) {
                status.innerHTML = `<a href="${data.downloadUrl}" target="_blank" rel="noopener noreferrer" class="download-btn">Videoyu Doğrudan İndir</a>`;
            } else {
                status.innerHTML = `<span class="error">${data.error || 'İndirme bağlantısı oluşturulamadı.'}</span>`;
            }
        } catch (err) {
            status.innerHTML = '<span class="error">Sunucuya erişilemedi. Lütfen tekrar deneyin.</span>';
        }
    }
</script>

</body>
</html>
